<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מפת מבנים ומשרדים</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1b2433;--mut:#6b778c;--ln:#d9dfea;--ac:#2f6fed;--off:#e6efff;--offb:#9db9f5;--cls:#eceef2;--hl:#ffd54a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a212d;--tx:#e8edf6;--mut:#93a0b6;--ln:#2d3748;--ac:#6c9bff;--off:#1f2f52;--offb:#3d5a99;--cls:#222936;--hl:#c79a00;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px))}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tabs{position:relative;z-index:2;flex-wrap:nowrap}
.tabs button{flex:1;min-width:0;white-space:nowrap}
h1{font-size:20px;margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button,.fl button,.btn{min-height:44px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.tabs button.on,.fl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input{min-height:44px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;min-width:0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:12px}
.stats{color:var(--mut);font-size:13px;margin:8px 2px}
.main{display:flex;gap:12px;align-items:flex-start}
.fl{display:flex;flex-direction:column;gap:6px;min-width:84px}
.fl button{padding:10px 6px;font-size:13px}
.fl small{display:block;opacity:.75}
.plan{flex:1;min-width:0;overflow-x:auto}
.grid{display:grid;gap:8px;min-width:520px}
.corr{grid-column:1/-1;height:34px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--ln) 0 8px,transparent 8px 16px);opacity:.6;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.corr span{background:var(--bg);padding:0 10px;border-radius:6px}
.room{border:2px solid var(--offb);background:var(--off);border-radius:10px;padding:8px;min-height:104px;cursor:pointer;text-align:start;color:var(--tx);font:inherit;display:flex;flex-direction:column;gap:6px}
.room.cls{border:2px dashed var(--ln);background:var(--cls);color:var(--mut);cursor:default;opacity:.8}
.room.sel{outline:3px solid var(--ac)}
.room.hit{box-shadow:0 0 0 4px var(--hl)}
.room b{font-size:13px}
.room .n{font-size:11px;color:var(--mut)}
.av{display:flex;flex-wrap:wrap;gap:4px}
.av i{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.x{background:none;border:none;color:#d33;cursor:pointer;font-size:20px;min-width:44px;min-height:44px}
.sr{display:block;width:100%;text-align:start;background:none;border:none;font:inherit;min-height:44px;padding:8px 0;cursor:pointer;color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs button.on:focus-visible,.fl button.on:focus-visible{outline-color:var(--tx)}
label{font-size:13px;color:var(--mut)}
html,body{max-width:100%;overflow-x:hidden}
.main,.plan,.card{max-width:100%}
#v3{perspective:1500px;overflow:hidden;position:relative;margin-top:8px}
#bld{position:absolute;left:50%;top:50%;width:640px;height:320px;margin:-160px 0 0 -320px;transform-style:preserve-3d}
.slab{position:absolute;inset:0;background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:8px;display:grid;grid-template-rows:1fr 1fr;gap:16px 6px;opacity:.92}
.slab.cur{border-color:var(--ac);opacity:1}
.lab{position:absolute;top:-24px;right:2px;font-size:13px;color:var(--mut)}
.r3{border:1.5px solid var(--offb);background:var(--off);border-radius:6px;padding:4px;font-size:11px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer}
.r3.c{border-style:dashed;border-color:var(--ln);background:var(--cls);color:var(--mut);opacity:.7}
.r3.sel{outline:3px solid var(--ac)}
.r3.hit{background:var(--hl);color:#000}
.fx{position:absolute;inset:0;background:linear-gradient(135deg,var(--card),var(--bg));border:2px solid var(--ln);border-radius:6px;padding:10px;display:grid;grid-template-rows:1fr 38px 1fr;gap:10px;transform-style:preserve-3d}
.e1,.e2{position:absolute;background:var(--ln)}
.e1{left:0;top:100%;width:100%;height:16px;transform-origin:top;transform:rotateX(-90deg)}
.e2{left:100%;top:0;width:16px;height:100%;transform-origin:left;transform:rotateY(90deg)}
.cor{grid-column:1/-1;grid-row:2;display:grid;place-items:center;font-size:12px;color:var(--mut);background:repeating-linear-gradient(90deg,var(--ln) 0 10px,transparent 10px 20px);border-radius:4px;opacity:.7}
.rm{position:relative;transform-style:preserve-3d;background:var(--off);border-radius:2px;padding:6px;font-size:12px;cursor:pointer}
.rm.c{background:var(--cls);color:var(--mut)}
.rm.sel{outline:3px solid var(--ac)}
.rm.hit{background:var(--hl);color:#000}
.w{position:absolute;display:block;background:var(--offb);opacity:.9}
.rm.c .w{background:var(--ln)}
.wb{left:0;top:0;width:100%;height:46px;transform-origin:top;transform:rotateX(90deg)}
.wf{left:0;top:100%;width:100%;height:46px;transform-origin:top;transform:rotateX(90deg)}
.wl{left:0;top:0;width:46px;height:100%;transform-origin:left;transform:rotateY(-90deg)}
.wr{left:100%;top:0;width:46px;height:100%;transform-origin:left;transform:rotateY(-90deg)}
.w.d{background:linear-gradient(90deg,var(--offb) 0 30%,transparent 30% 62%,var(--offb) 62%)}
.pp{position:absolute;left:0;right:0;bottom:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;transform-style:preserve-3d}
.p{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center;transform-origin:50% 100%;transform:rotateZ(calc(var(--rz)*-1)) rotateX(-90deg);box-shadow:0 0 0 2px var(--card)}
@media(max-width:600px){.main{flex-direction:column;align-items:stretch;width:100%}.plan{width:100%;flex:none}.fl{flex-direction:row;flex-wrap:wrap}.fl button{padding:8px 10px}}
</style>
</head>
<body>
<h1>🏢 מפת מבנים ומשרדים</h1>
<div class="row tabs" id="tabs" role="group" aria-label="בחירת מבנה"></div>
<div class="row card" style="margin-top:10px">
  <label>קומות במבנה <input id="nf" type="number" min="1" max="20" style="width:70px"></label>
  <label>חדרים בקומה <input id="nr" type="number" min="2" max="24" style="width:70px"></label>
  <input id="q" aria-label="חיפוש אדם" placeholder="🔍 חיפוש אדם..." style="flex:1;min-width:140px">
</div>
<div id="res" aria-live="polite"></div>
<div class="stats" id="stats" aria-live="polite"></div>
<div class="card" style="margin:0 0 12px"><div class="row"><b>תצוגת 3D</b><label>סיבוב <input type="range" id="rz" min="-80" max="80" value="-30"></label><label>הטייה <input type="range" id="rx" min="20" max="75" value="55"></label><span class="stats" style="margin:0">לחץ על חדר כדי לבחור אותו</span></div><div id="v3" aria-hidden="true"><div id="bld"></div></div></div>
<div class="main">
  <div class="fl" id="fl" role="group" aria-label="בחירת קומה"></div>
  <div class="plan card" style="margin-top:0"><div class="grid" id="grid"></div></div>
</div>
<div class="card" id="ed"></div>

<script>
const KEY="floorsApp1";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const names=["דנה לוי","יוסי כהן","מיכל אברהם","רון ביטון","נועה פרידמן","אורי שמש"];
function mkRooms(n,b,f){return Array.from({length:n},(_,i)=>({type:(i%3==2)?"cls":"off",name:(i%3==2)?"כיתה":"משרד "+(f*100+i+1),people:[]}))}
function init(){const bs=["מבנה א","מבנה ב","מבנה ג"].map((n,b)=>({name:n,floors:Array.from({length:3},(_,f)=>mkRooms(10,b,f))}));
bs[0].floors[0][0].people=[names[0],names[1]];bs[0].floors[0][1].people=[names[2]];bs[1].floors[1][3].people=[names[3],names[4]];bs[2].floors[2][0].people=[names[5]];return bs}
let B;try{B=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!B||!B.length)B=init();
let cb=0,cf=0,cr=null,q="";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(B))}catch(e){}};
const bld=()=>B[cb];
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("");
const match=p=>q&&p.includes(q);

function render(){
  const b=bld();
  if(cf>=b.floors.length)cf=0;
  document.getElementById("tabs").innerHTML=B.map((x,i)=>`<button class="${i==cb?"on":""}" aria-pressed="${i==cb}" data-b="${i}">${esc(x.name)}</button>`).join("");
  document.getElementById("nf").value=b.floors.length;
  document.getElementById("nr").value=b.floors[cf].length;
  const tot=b.floors.flat().reduce((a,r)=>a+(r.type=="off"?r.people.length:0),0);
  const offs=b.floors.flat().filter(r=>r.type=="off").length;
  document.getElementById("stats").textContent=`${b.name}: ${offs} משרדים · ${tot} אנשים`;
  document.getElementById("fl").innerHTML=b.floors.map((f,i)=>({f,i})).reverse().map(({f,i})=>{
    const c=f.filter(r=>r.type=="off").reduce((a,r)=>a+r.people.length,0);
    return `<button class="${i==cf?"on":""}" aria-pressed="${i==cf}" data-f="${i}">קומה ${i}<small>${c} אנשים</small></button>`}).join("");
  const rooms=b.floors[cf],cols=Math.ceil(rooms.length/2);
  const cell=(r,i)=>`<button class="room ${r.type=="cls"?"cls":""} ${cr===i?"sel":""} ${r.people.some(match)?"hit":""}" data-r="${i}" aria-pressed="${cr===i}" aria-label="${esc(r.name)}, ${r.type=="off"?(r.people.length?r.people.join(", "):"ריק"):"כיתה"}"><b>${esc(r.name)}</b>`+
    (r.type=="off"?`<div class="av">${r.people.map(p=>`<i title="${esc(p)}">${esc(initials(p))}</i>`).join("")}</div><span class="n">${r.people.length?r.people.length+" אנשים":"ריק"}</span>`:`<span class="n">כיתת לימוד</span>`)+`</button>`;
  const top=rooms.slice(0,cols),bot=rooms.slice(cols);
  const g=document.getElementById("grid");
  g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  g.innerHTML=top.map((r,i)=>cell(r,i)).join("")+`<div class="corr"><span>🛗 מסדרון · מדרגות</span></div>`+bot.map((r,i)=>cell(r,i+cols)).join("");
  renderEd();render3d();
}
function floorHTML(b){
 const f=b.floors[cf],cols=Math.ceil(f.length/2);
 const room=(r,ri)=>{const top=ri<cols;
  const pp=r.type=="off"?r.people.map(p=>`<i class="p" title="${esc(p)}">${esc(initials(p))}</i>`).join(""):"";
  return `<div class="rm ${r.type=="cls"?"c":""} ${cr===ri?"sel":""} ${r.people.some(match)?"hit":""}" data-g="${cb},${cf},${ri}" style="grid-row:${top?1:3};grid-column:${ri%cols+1}"><span class="w wb ${top?"":"d"}"></span><span class="w wf ${top?"d":""}"></span><span class="w wl"></span><span class="w wr"></span><b>${esc(r.name)}</b><div class="pp">${pp}</div></div>`};
 return `<div class="fx" style="grid-template-columns:repeat(${cols},1fr)">${f.map(room).join("")}<div class="cor">מסדרון · מדרגות · מעלית</div><span class="e1"></span><span class="e2"></span></div>`;
}
let rz=-30,rx=55;
function render3d(){
 const b=bld(),n=b.floors.length,gap=76,v=document.getElementById("v3"),el=document.getElementById("bld");
 el.innerHTML=floorHTML(b);
 const a=rz*Math.PI/180,t=rx*Math.PI/180;
 const s=Math.min(1,(v.clientWidth-16)/(640*Math.abs(Math.cos(a))+320*Math.abs(Math.sin(a))));
 const h=((320*Math.abs(Math.cos(a))+640*Math.abs(Math.sin(a)))*Math.sin(t)+60*Math.cos(t)+70)*s;
 v.style.height=Math.max(h,160)+"px";
 el.style.setProperty("--rz",rz+"deg");el.style.transform=`scale(${s}) rotateX(${rx}deg) rotateZ(${rz}deg)`;
}
function renderEd(){
  const ed=document.getElementById("ed"),r=cr!=null?bld().floors[cf][cr]:null;
  if(!r){ed.innerHTML='<span style="color:var(--mut)">לחץ על חדר כדי לערוך אותו ולשייך אליו אנשים</span>';return}
  ed.innerHTML=`<div class="row"><input id="rn" aria-label="שם החדר" value="${esc(r.name)}" style="flex:1"><button class="btn" id="rt">${r.type=="off"?"משרד ✓":"כיתה"} (החלף)</button></div>`+
  (r.type=="off"?`<div style="margin-top:8px">${r.people.map((p,i)=>`<div class="pl"><span>${esc(p)}</span><button class="x" data-d="${i}" aria-label="הסר ${esc(p)}">✕</button></div>`).join("")||'<div class="stats">אין אנשים במשרד</div>'}</div>
  <div class="row" style="margin-top:10px"><input id="np" aria-label="שם עובד חדש" placeholder="שם עובד חדש" style="flex:1"><button class="btn" id="ap">הוסף</button></div>`:'<div class="stats">כיתות לא מציגות אנשים</div>');
  const rn=document.getElementById("rn");rn.oninput=()=>{r.name=rn.value;save()};rn.onchange=render;
  document.getElementById("rt").onclick=()=>{r.type=r.type=="off"?"cls":"off";save();render()};
  const add=()=>{const v=document.getElementById("np");if(v&&v.value.trim()){r.people.push(v.value.trim());save();render();const n=document.getElementById("np");if(n)n.focus()}};
  const ap=document.getElementById("ap");if(ap){ap.onclick=add;document.getElementById("np").onkeydown=e=>{if(e.key=="Enter")add()}}
  ed.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{r.people.splice(+x.dataset.d,1);save();render()});
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-b],[data-f],[data-r],[data-g]");if(!t)return;
  const d=t.dataset;
  if(d.b!=null){cb=+d.b;cf=0;cr=null}
  else if(d.f!=null){cf=+d.f;cr=null}
  else if(d.r!=null){cr=+d.r}
  else if(d.g){const[a,b,c]=d.g.split(",").map(Number);cb=a;cf=b;cr=c}
  render();
  const k=Object.keys(d)[0];if(k!="g"){const el=document.querySelector(`[data-${k}="${d[k]}"]`);if(el)el.focus()}
});
document.getElementById("nf").onchange=e=>{const n=Math.max(1,Math.min(20,+e.target.value||1)),b=bld();
  while(b.floors.length<n)b.floors.push(mkRooms(b.floors[0].length,cb,b.floors.length));b.floors.length=n;save();render()};
document.getElementById("nr").onchange=e=>{const n=Math.max(2,Math.min(24,+e.target.value||2)),f=bld().floors[cf];
  while(f.length<n)f.push({type:"off",name:"משרד חדש",people:[]});f.length=n;cr=null;save();render()};
document.getElementById("q").oninput=e=>{q=e.target.value.trim();
  const out=[];B.forEach((b,bi)=>b.floors.forEach((f,fi)=>f.forEach((r,ri)=>{if(r.type=="off")r.people.forEach(p=>{if(match(p))out.push(`<button class="sr" data-g="${bi},${fi},${ri}">${esc(p)} — ${esc(b.name)}, קומה ${fi}, ${esc(r.name)}</button>`)})})));
  document.getElementById("res").innerHTML=q?`<div class="card">${out.join("")||"לא נמצא"}</div>`:"";render()};
document.getElementById("rz").oninput=e=>{rz=+e.target.value;render3d()};
document.getElementById("rx").oninput=e=>{rx=+e.target.value;render3d()};
addEventListener("resize",render3d);
render();
</script>
</body>
</html>
